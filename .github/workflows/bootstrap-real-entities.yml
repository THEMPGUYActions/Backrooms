name: TEMP - Bootstrap Real Entity Models

on:
  workflow_dispatch:
    inputs:
      smiler_url:
        description: Temporary signed GLB URL for Smiler
        required: false
        type: string
      hound_url:
        description: Temporary signed GLB URL for Hound
        required: false
        type: string
      skinstealer_url:
        description: Temporary signed GLB URL for Skin Stealer
        required: false
        type: string
      duller_url:
        description: Temporary signed GLB URL for Duller
        required: false
        type: string
      deathmoth_url:
        description: Temporary signed GLB URL for Deathmoth
        required: false
        type: string
      faceling_url:
        description: Temporary signed GLB URL for Faceling
        required: false
        type: string
      partygoer_url:
        description: Temporary signed GLB URL for Partygoer
        required: false
        type: string
      bacteria_url:
        description: Temporary signed GLB URL for Bacteria
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: temp-real-entity-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Download and commit real entity GLBs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev with Git LFS
        uses: actions/checkout@v6
        with:
          ref: dev
          lfs: true
          fetch-depth: 0

      - name: Download supplied models
        shell: bash
        env:
          SMILER_URL: ${{ inputs.smiler_url }}
          HOUND_URL: ${{ inputs.hound_url }}
          SKINSTEALER_URL: ${{ inputs.skinstealer_url }}
          DULLER_URL: ${{ inputs.duller_url }}
          DEATHMOTH_URL: ${{ inputs.deathmoth_url }}
          FACELING_URL: ${{ inputs.faceling_url }}
          PARTYGOER_URL: ${{ inputs.partygoer_url }}
          BACTERIA_URL: ${{ inputs.bacteria_url }}
        run: |
          set -u
          mkdir -p assets/entities
          download() {
            name="$1"
            url="$2"
            out="assets/entities/$name.glb"
            if [ -z "$url" ]; then
              echo "SKIP $name: URL not supplied"
              return 0
            fi
            echo "Downloading $name..."
            curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180 -sS "$url" -o "$out"
            python3 - "$out" "$name" <<'PY'
          import sys, struct, os
          p, name = sys.argv[1], sys.argv[2]
          data = open(p, "rb").read(12)
          if len(data) < 12 or data[:4] != b"glTF":
              raise SystemExit(f"{name}: downloaded file is not a GLB")
          version, declared = struct.unpack_from("<II", data, 4)
          actual = os.path.getsize(p)
          if version != 2:
              raise SystemExit(f"{name}: unsupported GLB version {version}")
          if declared > actual:
              raise SystemExit(f"{name}: truncated GLB ({declared} > {actual})")
          print(f"OK {name}: GLB v{version}, {actual} bytes")
          PY
          }
          download smiler "$SMILER_URL"
          download hound "$HOUND_URL"
          download skinstealer "$SKINSTEALER_URL"
          download duller "$DULLER_URL"
          download deathmoth "$DEATHMOTH_URL"
          download faceling "$FACELING_URL"
          download partygoer "$PARTYGOER_URL"
          download bacteria "$BACTERIA_URL"

      - name: Commit models to dev
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/entities
          if git diff --cached --quiet; then
            echo "No entity model changes to commit."
            exit 0
          fi
          git commit -m "assets: bootstrap real entity models"
          git push origin HEAD:dev
