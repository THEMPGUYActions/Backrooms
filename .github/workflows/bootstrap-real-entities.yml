name: TEMP - Bootstrap Real Entity Models

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temp-real-entity-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Download and commit real entity GLBs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev with Git LFS
        uses: actions/checkout@v6
        with:
          ref: dev
          lfs: true
          fetch-depth: 0

      - name: Read signed URLs from temporary branch
        shell: bash
        run: |
          set -u
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 30 -sS \
            "https://raw.githubusercontent.com/THEMPGUYActions/Backrooms/temp-entity-urls/entity-urls.txt" \
            -o /tmp/entity-urls.txt
          mkdir -p assets/entities
          mapfile -t URLS < <(grep -v '^#' /tmp/entity-urls.txt | sed 's/[[:space:]]*$//')
          names=(smiler hound skinstealer duller deathmoth faceling partygoer bacteria)
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            url="${URLS[$i]:-}"
            out="assets/entities/$name.glb"
            if [ -z "$url" ]; then
              echo "SKIP $name: blank URL"
              continue
            fi
            echo "Downloading $name..."
            curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180 -sS "$url" -o "$out"
            python3 -c 'import sys,struct,os; p,name=sys.argv[1:3]; data=open(p,"rb").read(12); assert len(data)>=12 and data[:4]==b"glTF", f"{name}: not a GLB"; version,declared=struct.unpack_from("<II",data,4); actual=os.path.getsize(p); assert version==2, f"{name}: unsupported GLB version {version}"; assert declared<=actual, f"{name}: truncated GLB"; print(f"OK {name}: GLB v{version}, {actual} bytes")' "$out" "$name"
          done

      - name: Commit models to dev
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/entities
          if git diff --cached --quiet; then
            echo "No entity model changes to commit."
            exit 0
          fi
          git commit -m "assets: bootstrap real entity models"
          git push origin HEAD:dev
