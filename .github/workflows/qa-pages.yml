name: QA and Pages

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: backrooms-pages
  cancel-in-progress: false

jobs:
  bootstrap-entity-assets:
    name: Bootstrap missing entity models
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout development branch with LFS
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
          lfs: true
          fetch-depth: 0

      - name: Bootstrap missing entity binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: node scripts/bootstrap-entity-assets.mjs
        env:
          SKETCHFAB_ACCESS_TOKEN: ${{ secrets.SKETCHFAB_ACCESS_TOKEN }}
          ENTITY_SMILER_URL: ${{ secrets.ENTITY_SMILER_URL }}
          ENTITY_HOUND_URL: ${{ secrets.ENTITY_HOUND_URL }}
          ENTITY_SKINSTEALER_URL: ${{ secrets.ENTITY_SKINSTEALER_URL }}
          ENTITY_DULLER_URL: ${{ secrets.ENTITY_DULLER_URL }}
          ENTITY_DEATHMOTH_URL: ${{ secrets.ENTITY_DEATHMOTH_URL }}
          ENTITY_FACELING_URL: ${{ secrets.ENTITY_FACELING_URL }}
          ENTITY_PARTYGOER_URL: ${{ secrets.ENTITY_PARTYGOER_URL }}
          ENTITY_BACTERIA_URL: ${{ secrets.ENTITY_BACTERIA_URL }}

      - name: Skip bootstrap on non-development runs
        if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
        run: echo "Entity bootstrap is only active for development branch pushes."

  qa:
    name: QA and static build
    needs: bootstrap-entity-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current branch state
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
          lfs: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build
        run: npm run build

      - name: Quality checks
        run: npm run check

      - name: Verify build
        run: |
          test -s dist/index.html
          test -s dist/src/main.js
          test -s dist/src/admin.js
          test -s dist/styles.css
          test -f dist/.nojekyll

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Runtime browser smoke
        run: node scripts/runtime-smoke.mjs
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload CI build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-preview-${{ github.event.pull_request.number || github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: Publish production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          lfs: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build production
        run: npm run build
        env:
          BACKROOMS_PRODUCTION_BUILD: "1"

      - name: Publish main to Pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true
          force_orphan: false
          full_commit_message: "deploy: production ${{ github.sha }}"

  deploy-dev:
    name: Publish development
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev
          lfs: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build development
        run: npm run build

      - name: Publish dev to /dev/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: dev
          full_commit_message: "deploy: dev ${{ github.sha }}"
